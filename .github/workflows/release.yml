name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# Note: this workflow does NOT build the plugin in CI (see build.yml for why).
# It creates a GitHub Release on tag push. The maintainer publish script builds
# the JAR locally, pushes the tag, waits for this release, and uploads the asset:
# `./scripts/publish-release.sh`.

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## Install

            Download the `com.arc1.mcp_<version>.jar` asset below, drop it into your Eclipse install's `dropins/` folder, and restart Eclipse with `-clean`. See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup including the `eclipse.ini` configuration.

            ## Verify

            ```bash
            ./scripts/smoke-test.sh <your-destination-id>
            ```

            ## Notes

            The plugin JAR is built and uploaded by `./scripts/publish-release.sh` from the maintainer machine. SAP ADT JARs aren't redistributable, so public CI only creates the release shell; the script performs the local build and asset upload. If the JAR is missing from this release, please open an issue.
